Destinationes {
	Linux {
		Nomen = "GNU/Linux"
		Classis = "systema"
		Defalta = true
	}
}
"Linux" {
	Instrumenta {
		CC {
			Stadium = "compilator/cc"
			Imperatum = "g++"
			ArgumentaExtra {
				A = "-c"
				B = "-std=c++17"
				C = "-fpermissive"
			}
			ArgumentumDefinitionis = "-D"
			ArgumentumTituli = "-I"
			ArgumentumDestinationis = "-o"
			ExtensioDestinationis = "o"
		}
		BS {
			Stadium = "compilator/ertbs"
		}
		Adhaesor {
			Stadium = "adhaesor"
			Imperatum = "g++"
			ArgumentaExtra {
				A = "-pthread"
				B = "-lrt"
				C = "-lm"
			}
			ArgumentumDestinationis = "-o"
		}
		Auxilia {
			Stadium = "auxilia"
			Modus = "incorporaliter"
			Modulus = "auxilia"
			Imperatum = "g++"
			ArgumentaExtra {
				A = "-c"
				B = "-std=c++17"
				C = "-fpermissive"
			}
			ArgumentumDestinationis = "-o"
			ExtensioDestinationis = "o"
			Icones {
				Codificator = "EIWV"
				Extensio = "eiwv"
				Magnitudines { A = 16 B = 24 C = 32 D = 48 E = 64 F = 256 }
			}
		}
	}
	Definitiones {
		ESSE_SYSTEMA_UNIX = true
		ESSE_SYSTEMA_LINUX = true
	}
}
"Linux-Release" {
	Instrumenta {
		CC { ArgumentaExtra {
			D = "-O3"
			E = "-fvisibility=hidden"
		} }
		Adhaesor { ArgumentaExtra {
			D = "-O3"
			E = "-fvisibility=hidden"
			F = "-s"
		} }
	}
}
"Linux-Debug" {
	Instrumenta {
		CC { ArgumentaExtra {
			G = "-O0"
			H = "-ggdb"
		} }
		Adhaesor { ArgumentaExtra {
			G = "-O0"
			H = "-ggdb"
		} }
	}
	Definitiones {
		ESSE_DEBUG = true
	}
}
"Linux-X86" {
	Definitiones {
		ESSE_MACHINA_X86_32 = true	
	}
}
"Linux-X64" {
	Definitiones {
		ESSE_MACHINA_64 = true
		ESSE_MACHINA_X86_64 = true	
	}
}
"Linux-ARM" {
	Definitiones {
		ESSE_MACHINA_ARM_V7 = true
	}
}
"Linux-ARM64" {
	Definitiones {
		ESSE_MACHINA_64 = true
		ESSE_MACHINA_ARM_V8 = true
	}
}
"Linux-Console" {
	Definitiones { ESSE_SUBSYSTEMA_CONSOLE = true }
}
"Linux-GUI" {
	Definitiones { ESSE_SUBSYSTEMA_GUI = true }
}
"Linux-Library" {
	Definitiones { ESSE_SUBSYSTEMA_LIBRARY = true }
	Instrumenta {
		Adhaesor {
			ArgumentaExtra {
				I = "-shared"
				J = "-fPIC"
			}
			ExtensioDestinationis = "so"
		}
	}
}
"Linux-Silent" {
	Definitiones { ESSE_SUBSYSTEMA_SILENT = true }
}